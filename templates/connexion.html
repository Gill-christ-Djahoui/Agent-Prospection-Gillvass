<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Connexion · Prospection</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%234f46e5'/%3E%3Cpath d='m24 8-5.5 16-3-6.5L9 14.5Z' fill='none' stroke='white' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
  <script>try { var t = localStorage.getItem("theme"); if (t) document.documentElement.dataset.theme = t; } catch (e) { /* thème système */ }</script>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body class="page-connexion">
  <main class="connexion">
    <div class="connexion-marque">
      <span class="marque-logo marque-logo-grand"><svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></span>
      <h1>Prospection</h1>
      <p>Connecte-toi pour accéder à ton espace.</p>
    </div>

    <form class="connexion-carte" method="post" action="{{ url_for('connexion') }}" autocomplete="on">
      <input type="hidden" name="suite" value="{{ suite }}">
      {% if erreur %}<p class="connexion-erreur" role="alert">{{ erreur }}</p>{% endif %}
      <div class="champ">
        <label for="identifiant">Identifiant</label>
        <input id="identifiant" name="identifiant" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
      </div>
      <div class="champ">
        <label for="mot_de_passe">Mot de passe</label>
        <div class="champ-mdp">
          <input id="mot_de_passe" name="mot_de_passe" type="password" autocomplete="current-password" required>
          <button type="button" class="oeil" id="oeil" aria-label="Afficher le mot de passe">Afficher</button>
        </div>
      </div>
      <button type="submit" class="bouton bouton-large">Se connecter</button>
    </form>
    <p class="connexion-pied">Application locale : tes données restent sur cet ordinateur.</p>
  </main>
  <script>
    document.getElementById("oeil").addEventListener("click", function () {
      var champ = document.getElementById("mot_de_passe");
      var visible = champ.type === "text";
      champ.type = visible ? "password" : "text";
      this.textContent = visible ? "Afficher" : "Masquer";
      this.setAttribute("aria-label", visible ? "Afficher le mot de passe" : "Masquer le mot de passe");
    });
  </script>
</body>
</html>
